[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodidact"
version = "0.1.0"
description = "An LLM agent that teaches itself to use software it has never seen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saqlain Islam" }]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autodidact = "autodidact.cli:main"
autodidact-inventory-server = "autodidact.envs.inventory.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Task templates bind loop values through default arguments on purpose.
"src/autodidact/envs/*/tasks.py" = ["B006", "B008"]
