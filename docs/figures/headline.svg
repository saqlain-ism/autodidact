<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" role="img" aria-label="Success on unseen tasks before and after practice"><title>Success on unseen tasks before and after practice</title><rect width="720" height="296" rx="8" fill="#ffffff"/><text x="24" y="34" font-size="18" fill="#1f2328" text-anchor="start" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Success on unseen tasks</text><text x="24" y="56" font-size="12" fill="#59636e" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Same model, same hidden tasks; only the agent&#x27;s self-written notebook differs.</text><rect x="24" y="74" width="12" height="12" rx="2" fill="#9aa1ad"/><text x="42" y="84" font-size="12" fill="#59636e" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">No practice (tool docs only)</text><rect x="234" y="74" width="12" height="12" rx="2" fill="#1f6feb"/><text x="252" y="84" font-size="12" fill="#59636e" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">After self-directed practice</text><text x="24" y="120" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Tasks affected by the rule it discovered</text><rect x="24" y="130" width="632" height="22" rx="4" fill="#e6e8eb"/><rect x="24" y="130" width="395.0" height="22" rx="4" fill="#9aa1ad"/><text x="664" y="146" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">62.5%</text><text x="32" y="146" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">15/24</text><rect x="24" y="158" width="632" height="22" rx="4" fill="#e6e8eb"/><rect x="2